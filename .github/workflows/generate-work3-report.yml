name: Generate work3 DOCX report

on:
  push:
    branches: [main]
    paths:
      - 'work3/scripts/make_report.py'
      - 'work3/results/**'
      - '.github/workflows/generate-work3-report.yml'

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install report dependencies
        run: python -m pip install python-docx matplotlib
      - name: Generate DOCX
        run: python work3/scripts/make_report.py --results work3/results --output work3/results/report.docx
      - name: Commit DOCX and remove Markdown draft
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f work3/report.md || true
          git add work3/results/report.docx
          if ! git diff --cached --quiet; then
            git commit -m "Add formatted work3 DOCX report"
            git push
          fi
